<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#101723">
  <meta name="description" content="灰燼の誓い 第一章・戦士編。スマホ縦持ち対応のドット絵JRPG。">
  <title>灰燼の誓い — 第一章 戦士と石門</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<main id="app">
  <section id="gameArea" aria-label="ゲーム画面">
    <div id="frame">
      <canvas id="screen" width="320" height="360" aria-label="ゲーム画面"></canvas>
      <div id="hud" hidden>
        <div class="hud-row"><span id="areaName" class="hud-chip"></span><span id="heroStats" class="hud-chip"></span></div>
        <div id="mission" class="mission"></div>
      </div>
      <div id="panel" aria-live="polite"></div>
      <div id="toast" role="status"></div>
    </div>
  </section>
  <section id="controller" aria-label="バーチャルコントローラー">
    <div class="controller-caption"><span>ASHEN OATH</span><span>CHAPTER I / 30 FPS</span></div>
    <div class="controller-main">
      <div class="pad-wrap"><div class="pad" role="group" aria-label="十字キー">
        <button type="button" class="dir up" data-dir="up" aria-label="上に移動">▲</button>
        <button type="button" class="dir left" data-dir="left" aria-label="左に移動">◀</button>
        <button type="button" class="dir right" data-dir="right" aria-label="右に移動">▶</button>
        <button type="button" class="dir down" data-dir="down" aria-label="下に移動">▼</button>
      </div></div>
      <div class="buttons-wrap"><div class="buttons-diamond" role="group" aria-label="アクションボタン">
        <button type="button" class="btn-game btn-x" data-key="X">X<small>メニュー</small></button>
        <button type="button" class="btn-game btn-y" data-key="Y">Y<small>じょうたい</small></button>
        <button type="button" class="btn-game btn-b" data-key="B">B<small>もどる</small></button>
        <button type="button" class="btn-game btn-a" data-key="A">A<small>けってい</small></button>
      </div></div>
    </div>
    <div class="controller-footer">十字キー長押し：移動　 A：会話・決定　 X：メニュー　 B：戻る</div>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
