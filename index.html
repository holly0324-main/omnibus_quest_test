<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#141c27">
  <meta name="description" content="スマートフォンで遊べるオリジナルのレトロJRPG『灰燼の誓い』第1章。HTML一枚で動くプロトタイプ。">
  <title>灰燼の誓い — 第一章 戦士と石門</title>
  <style>
    :root { color-scheme:dark; --gold:#e9c77a; --ink:#101b2b; --paper:#f4ead6; }
    * {box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
    html,body {margin:0; width:100%; height:100%; overflow:hidden; overscroll-behavior:none;}
    body {font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif; color:var(--paper);
      background:radial-gradient(ellipse at 50% 12%,#344157 0%,#101722 66%,#090d13 100%);}
    button {font:inherit; cursor:pointer; user-select:none; -webkit-user-select:none; touch-action:manipulation;}
    button:focus-visible {outline:3px solid #ffe58a; outline-offset:3px;}
    #app {width:100%; max-width:540px; height:100vh; height:100dvh; margin:0 auto;
      padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
      display:flex; flex-direction:column; border-left:1px solid #354153; border-right:1px solid #354153;}
    #gameArea {flex:6 1 0; min-height:0; display:flex; align-items:center; justify-content:center;
      overflow:hidden; padding:5px; background:linear-gradient(135deg,#172a38,#121a2a);}
    #frame {position:relative; flex:none; overflow:hidden; background:#233447;
      border:3px solid #85909c; box-shadow:0 0 0 2px #1e2936,0 7px 30px #080c14aa; image-rendering:pixelated;}
    #screen {display:block; width:100%; height:100%; image-rendering:pixelated;}
    #hud {position:absolute; z-index:2; top:7px; left:7px; right:7px; pointer-events:none;}
    .hud-row {display:flex; justify-content:space-between; align-items:center; gap:4px;}
    .hud-chip {border:2px solid #c8b385; background:#142034ec; padding:3px 6px;
      text-shadow:1px 1px #03060a; box-shadow:2px 2px #080d17; font-size:clamp(10px,1.4vh,12px); font-weight:800; white-space:nowrap;}
    #mission {margin-top:5px; width:fit-content; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
      color:#f5d89b; background:#12192ddc; border:1px solid #576478; padding:3px 6px; font-size:clamp(10px,1.35vh,12px);}
    #panel {position:absolute; z-index:3; left:8px; right:8px; bottom:8px; padding:11px 12px 8px;
      border:3px solid #e6d0a4; border-radius:4px; background:linear-gradient(180deg,#13243bf5,#0a1428f9);
      box-shadow:inset 0 0 0 2px #435e78,0 5px 0 #080c15a8; font-size:clamp(11px,1.6vh,14px);
      line-height:1.65; max-height:65%; overflow-y:auto; scrollbar-width:thin; }
    #panel:empty {display:none;}
    .panel-title {font-weight:900; letter-spacing:.09em; color:#f3d28d; margin-bottom:5px; font-size:1.1em;}
    .dialogue-copy {white-space:pre-wrap; min-height:3em; font-weight:700; color:#f5f0e5;}
    .hint {display:block; margin-top:4px; text-align:right; color:#b0c7d8; font-size:.87em;}
    .panel-btn {color:var(--paper); border:2px solid #8ca5ba; background:#263955; border-radius:2px;
      padding:6px 7px; font-weight:850; line-height:1.3; text-align:center; min-height:36px;}
    .panel-btn:active,.panel-btn.selected {background:#6d5232; color:#fff2c2; border-color:#ffe0a2;}
    .panel-btn:disabled {opacity:.46; cursor:not-allowed;}
    .panel-stack {display:grid; gap:7px; margin-top:6px;}
    .choices {display:grid; grid-template-columns:1fr 1fr; gap:5px; margin-top:6px;}
    .battle-note {margin-bottom:5px; color:#fae0aa; font-weight:700;}
    .small-note {font-size:.9em; color:#c6d1df;}
    .gold {color:#ffe09a;}
    .end-title {font-size:1.4em; color:#ffe5ac; font-weight:900; letter-spacing:.08em;}
    #controller {flex:4 1 0; min-height:0; display:flex; flex-direction:column; justify-content:space-between;
      padding:6px 10px 7px; background:repeating-linear-gradient(0deg,#283548,#283548 3px,#253143 4px);
      border-top:4px solid #798596; box-shadow:inset 0 2px #111927; touch-action:none; user-select:none; -webkit-user-select:none;}
    .controller-caption {display:flex; align-items:center; justify-content:space-between; gap:7px; padding:0 3px;
      color:#aeb8c9; text-transform:uppercase; font:800 10px/1.2 ui-monospace,monospace; letter-spacing:.12em;}
    .controller-main {flex:1; min-height:0; display:flex; justify-content:space-around; align-items:center; gap:6px;}
    .pad-wrap,.buttons-wrap {flex:1; display:flex; justify-content:center; align-items:center; min-width:0; height:100%;}
    .pad,.buttons-diamond {position:relative; width:min(37vw,178px,24dvh); height:min(37vw,178px,24dvh);
      max-width:178px; max-height:178px; min-width:112px; min-height:112px; flex:none;}
    .pad {filter:drop-shadow(0 5px 1px #111925);}
    .pad::after {content:""; position:absolute; top:36%; left:36%; width:28%; height:28%; background:#15202e;
      border:2px solid #536176; border-radius:2px; pointer-events:none;}
    .dir {position:absolute; width:34%; height:34%; border:2px solid #6c788c; background:linear-gradient(135deg,#44566b,#202f40);
      color:#e3eaf4; font-size:clamp(16px,3.5vw,23px); font-weight:900; padding:0;
      box-shadow:inset 1px 2px #728095,1px 3px #0a101d;}
    .dir:active,.dir.pressed {background:#b0a073; color:#101a29; box-shadow:inset 1px 2px #e5d1a1; transform:translateY(2px);}
    .dir.up {left:33%; top:0; border-radius:6px 6px 0 0;}
    .dir.down {left:33%; bottom:0; border-radius:0 0 6px 6px;}
    .dir.left {left:0; top:33%; border-radius:6px 0 0 6px;}
    .dir.right {right:0; top:33%; border-radius:0 6px 6px 0;}
    .btn-game {position:absolute; display:flex; flex-direction:column; align-items:center; justify-content:center;
      width:34%; height:34%; border:2px solid #d6cdbd; border-radius:50%; color:#fff8e9; font:900 clamp(16px,3.8vw,22px)/1 ui-monospace,monospace;
      text-shadow:1px 2px #1119; box-shadow:inset 1px 2px #ffffff65,1px 4px #121827; padding:0;}
    .btn-game small {font:800 clamp(8px,1.9vw,10px)/1.1 sans-serif; margin-top:2px; white-space:nowrap;}
    .btn-game:active,.btn-game.pressed {filter:brightness(1.33); transform:translateY(2px);box-shadow:inset 1px 2px #ffffff80;}
    .btn-a {right:0; top:33%; background:#b9423a;}
    .btn-b {left:33%; bottom:0; background:#81505f;}
    .btn-x {left:33%; top:0; background:#487f9a;}
    .btn-y {left:0; top:33%; background:#a28a4c;}
    .controller-footer {text-align:center; color:#b7c4d0; font-size:clamp(9px,1.5vh,12px); line-height:1.2; padding-bottom:2px;}
    @media (max-height:610px) {.controller-caption{font-size:9px}.controller-main{margin:0}.controller-footer{font-size:9px}#panel{padding:7px 9px 6px}}
  </style>
</head>
<body>
  <main id="app" aria-label="灰燼の誓い 第一章">
    <section id="gameArea" aria-label="ゲーム画面">
      <div id="frame">
        <canvas id="screen" width="320" height="400" aria-label="レトロ2Dゲーム画面">Canvasに対応したブラウザをご利用ください。</canvas>
        <div id="hud" hidden>
          <div class="hud-row"><span class="hud-chip" id="areaName"></span><span class="hud-chip" id="heroStats"></span></div>
          <div id="mission"></div>
        </div>
        <div id="panel" aria-live="polite"></div>
      </div>
    </section>
    <section id="controller" aria-label="バーチャルコントローラー">
      <div class="controller-caption"><span>ASHEN OATH / CONTROLLER</span><span>CHAPTER 01</span></div>
      <div class="controller-main">
        <div class="pad-wrap"><div class="pad" aria-label="十字キー">
          <button class="dir up" data-dir="up" aria-label="上へ移動">▲</button>
          <button class="dir left" data-dir="left" aria-label="左へ移動">◀</button>
          <button class="dir right" data-dir="right" aria-label="右へ移動">▶</button>
          <button class="dir down" data-dir="down" aria-label="下へ移動">▼</button>
        </div></div>
        <div class="buttons-wrap"><div class="buttons-diamond">
          <button class="btn-game btn-x" data-key="X" aria-label="X メニュー">X<small>メニュー</small></button>
          <button class="btn-game btn-y" data-key="Y" aria-label="Y 状態・ヒント">Y<small>じょうたい</small></button>
          <button class="btn-game btn-b" data-key="B" aria-label="B 戻る">B<small>もどる</small></button>
          <button class="btn-game btn-a" data-key="A" aria-label="A 決定">A<small>けってい</small></button>
        </div></div>
      </div>
      <div class="controller-footer">移動：十字キー　／　話す・調べる：A　／　PC：矢印・Enter・Esc・X・Y</div>
    </section>
  </main>
  <script>
  (() => {
    'use strict';
    // 画像・ライブラリ・通信なし。index.html だけで GitHub Pages 上で実行できる。
    const W=20,H=25,T=16,SAVE_KEY='ashen_oath_chapter1_v1';
    const canvas=document.getElementById('screen'),ctx=canvas.getContext('2d');
    const area=document.getElementById('gameArea'),frame=document.getElementById('frame');
    const panel=document.getElementById('panel'),hud=document.getElementById('hud');
    const areaName=document.getElementById('areaName'),heroStats=document.getElementById('heroStats'),mission=document.getElementById('mission');
    ctx.imageSmoothingEnabled=false;

    const color={ink:'#141c29',sand:'#9d8565',leaf:'#264a3b',gold:'#f3d187'};
    const DIRS={up:[0,-1],right:[1,0],down:[0,1],left:[-1,0]};
    const ENEMIES={
      slime:{id:'slime',name:'灰のスライム',hp:18,atk:3},
      bat:{id:'bat',name:'洞窟コウモリ',hp:27,atk:5},
      boss:{id:'boss',name:'石門の番兵',hp:53,atk:7}
    };
    const NPCS={
      village:[{x:10,y:9,id:'elder',name:'ミラ'}],
      road:[],
      capital:[{x:11,y:8,id:'captain',name:'隊長バルド'},{x:8,y:16,id:'healer',name:'薬師'}],
      dungeon:[{x:10,y:7,id:'boss',name:'石門の番兵'}]
    };

    function createMap(kind){
      const d=Array.from({length:H},()=>Array(W).fill(kind==='capital'?'p':kind==='dungeon'?'f':'g'));
      const put=(x,y,c)=>{if(x>=0&&x<W&&y>=0&&y<H)d[y][x]=c;};
      const rect=(x,y,w,h,c)=>{for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)put(xx,yy,c);};
      if(kind==='village'){
        for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(x===0||x===W-1||y===0||y===H-1)put(x,y,'t');
        rect(2,5,5,4,'h');rect(13,5,5,4,'h');rect(2,18,5,4,'r');rect(13,17,5,5,'r');
        rect(1,11,19,3,'d');rect(9,8,3,12,'d');rect(4,13,3,6,'d');
        put(10,10,'o');put(10,9,'d');for(let y=11;y<=13;y++)put(19,y,'d');
        put(5,5,'r');put(14,5,'r');put(7,7,'r');put(15,15,'r');
      }else if(kind==='road'){
        for(let y=0;y<H;y++)for(let x=0;x<W;x++){
          if(y<8||y>17||x===0||x===W-1)put(x,y,'t');
          else if((x*5+y*11)%17===0)put(x,y,'a');
        }
        for(let y=10;y<=14;y++)for(let x=0;x<W;x++)put(x,y,'d');
        for(let x=0;x<W;x++)if((x*13)%7<2){put(x,10,'g');put(x,14,'g');}
        for(let y=11;y<=13;y++){put(0,y,'d');put(19,y,'d');}
        put(6,12,'d');put(12,12,'d');
      }else if(kind==='capital'){
        for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(x===0||x===W-1||y===0||y===H-1)put(x,y,'w');
        rect(2,3,6,5,'h');rect(13,3,5,5,'h');rect(2,17,5,5,'h');rect(13,16,5,6,'h');
        rect(1,11,19,3,'p');rect(9,1,3,23,'p');
        rect(7,15,5,3,'p');put(8,16,'p');put(11,8,'p');
        put(5,9,'o');put(15,9,'o');
        for(let y=11;y<=13;y++)put(0,y,'p');
        for(let x=9;x<=11;x++)put(x,0,'p');
      }else if(kind==='dungeon'){
        for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(x===0||x===W-1||y===0||y===H-1)put(x,y,'^');
        rect(1,17,8,1,'^');rect(12,17,7,1,'^');
        rect(1,10,7,1,'^');rect(12,10,7,1,'^');
        rect(4,6,2,3,'^');rect(14,6,2,3,'^');
        rect(3,12,2,3,'^');rect(16,12,2,3,'^');
        put(5,19,'c');put(4,4,'o');put(15,4,'o');put(10,4,'p');
        for(let x=9;x<=11;x++)put(x,24,'f');
      }
      return d;
    }
    const MAPS={village:createMap('village'),road:createMap('road'),capital:createMap('capital'),dungeon:createMap('dungeon')};
    const NAMES={village:'ミルト村・廃墟',road:'東の街道',capital:'王都アステル',dungeon:'入隊試練・旧石門'};
    const WALKABLE=new Set(['g','d','p','f','o']);

    function newGame(){return {mode:'title',map:'village',x:4,y:17,facing:'up',
      hero:{name:'レオン',level:1,hp:44,maxHp:44,mp:10,maxMp:10,potions:2},
      flags:{elder:false,roadBattle:false,captain:false,caveBattle:false,chest:false,boss:false},
      victories:0,battle:null,dialogue:null,menuIndex:0,checkpoint:null};}
    let state=newGame();
    let savedAvailable=false;
    try{savedAvailable=!!localStorage.getItem(SAVE_KEY);}catch(e){/* プライベートモードでも遊べる */}

    function save(){
      const d={version:1,map:state.map,x:state.x,y:state.y,facing:state.facing,
        hero:state.hero,flags:state.flags,victories:state.victories};
      try{localStorage.setItem(SAVE_KEY,JSON.stringify(d));savedAvailable=true;}catch(e){}
    }
    function restore(){
      try{
        const d=JSON.parse(localStorage.getItem(SAVE_KEY));
        if(!d||d.version!==1||!MAPS[d.map]||!d.hero||!d.flags)throw Error('invalid save');
        const fresh=newGame();
        state={...fresh,...d,hero:{...fresh.hero,...d.hero},flags:{...fresh.flags,...d.flags},mode:d.flags.boss?'complete':'world',battle:null,dialogue:null,checkpoint:null};
        state.x=Math.min(W-1,Math.max(0,Math.floor(state.x)||0));
        state.y=Math.min(H-1,Math.max(0,Math.floor(state.y)||0));
        state.hero.hp=Math.max(1,Math.min(state.hero.maxHp,state.hero.hp));
        updateUI();return true;
      }catch(e){return false;}
    }
    function startNew(){
      state=newGame();state.mode='world';save();
      dialogue([
        '煙は消えた。それでもミルト村には、焼けた木の匂いが残っている。',
        'レオン「……生き残った人を探そう。」',
        '十字キーで歩き、近くの人に A で話しかけよう。'
      ]);
    }
    function objective(){
      if(state.flags.boss)return '第一章 完了';
      if(!state.flags.elder)return '生き残った村人を探す';
      if(!state.flags.roadBattle)return '東の街道を進む';
      if(!state.flags.captain)return '王都の討伐隊に志願する';
      if(state.map!=='dungeon')return '王都の北門から試練へ';
      if(!state.flags.caveBattle)return '旧石門の奥へ進む';
      return '最奥の番兵を倒す';
    }
    function hudUpdate(){
      const visible=!['title','complete','gameover'].includes(state.mode);
      hud.hidden=!visible;
      if(!visible)return;
      areaName.textContent=NAMES[state.map];
      heroStats.textContent=`Lv${state.hero.level} ♥${state.hero.hp}/${state.hero.maxHp} MP${state.hero.mp}`;
      mission.textContent='目的：'+objective();
    }
    function esc(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
    function btn(label,action,extra=''){return `<button type="button" class="panel-btn ${extra}" data-action="${esc(action)}">${esc(label)}</button>`;}

    function updateUI(){
      hudUpdate();
      let html='';
      if(state.mode==='title'){
        html=`<div class="panel-title">第一章　戦士と石門</div><div class="small-note">滅びた村から、王都の討伐隊へ。<br>歩き、話し、戦って入隊試練を突破しよう。</div>`+
          `<div class="panel-stack">${btn('▶ はじめから','new')}${savedAvailable?btn('↺ つづきから','continue'):''}${btn('？ 操作方法','titlehelp')}</div>`;
      }else if(state.mode==='dialogue'){
        const d=state.dialogue;
        html=`<div class="dialogue-copy">${esc(d.lines[d.i])}</div><span class="hint">${d.i===d.lines.length-1?'A：とじる':'A：つぎへ'} ▼</span>`;
      }else if(state.mode==='battle'){
        const b=state.battle;
        if(b.phase==='messages'){
          html=`<div class="panel-title">${esc(b.enemy.name)}　HP ${Math.max(0,b.enemy.hp)}/${b.enemy.maxHp}</div><div class="dialogue-copy">${esc(b.messages[b.messageIndex])}</div><span class="hint">A：つぎへ ▼</span>`;
        }else{
          const warning=b.enemy.id==='boss'&&b.turn%3===2?'⚠ 番兵が大きく振りかぶっている！':'どうする？';
          const options=['こうげき','ぼうぎょ','とくぎ MP3','どうぐ ×'+state.hero.potions];
          const actions=['attack','defend','skill','item'];
          let note=b.enemy.name+'　HP '+b.enemy.hp+'/'+b.enemy.maxHp+'　／　'+warning;
          if(b.enemy.id==='slime'&&b.tutorialStep===0)note='まずは「こうげき」を選んでみよう！';
          if(b.enemy.id==='slime'&&b.tutorialStep===1)note='敵が力をためた！「ぼうぎょ」を試そう。';
          html=`<div class="battle-note">${esc(note)}</div><div class="choices">`+
            options.map((o,i)=>{
              const locked=(b.enemy.id==='slime'&&b.tutorialStep<2&&i!==(b.tutorialStep===0?0:1));
              const disabled=(i===2&&state.hero.mp<3)||(i===3&&state.hero.potions<=0)||locked;
              return `<button type="button" class="panel-btn ${b.selected===i?'selected':''}" data-action="${actions[i]}" ${disabled?'disabled':''}>${esc(o)}</button>`;
            }).join('')+`</div><span class="hint">十字キーで選択 → Aで決定</span>`;
        }
      }else if(state.mode==='menu'){
        const acts=['resume','save','restart','help'];
        html=`<div class="panel-title">冒険メニュー</div><div class="small-note">セーブは移動・進行時にも自動で行われます。</div><div class="panel-stack">`+
          ['冒険にもどる','セーブする','最初からやり直す','操作方法'].map((v,i)=>btn(v,acts[i],i===state.menuIndex?'selected':'')).join('')+'</div>';
      }else if(state.mode==='help'){
        html=`<div class="panel-title">操作ガイド</div><div>十字キー：移動／コマンド選択<br>A：会話・調べる・決定<br>B：もどる（会話中は次へ）<br>X：冒険メニュー／戦闘ヒント<br>Y：状態を見る／戦闘ヒント</div><div class="small-note">隣に立って A で人・宝箱を調べられます。街や洞窟の出口は道の先にあります。</div><div class="panel-stack">${btn('とじる','back')}</div>`;
      }else if(state.mode==='status'){
        const h=state.hero;
        html=`<div class="panel-title">${esc(h.name)}　戦士 Lv${h.level}</div>`+
          `<div>HP　${h.hp} / ${h.maxHp}<br>MP　${h.mp} / ${h.maxMp}<br>やくそう　${h.potions}個<br>討伐した魔物　${state.victories}体</div>`+
          `<div class="small-note">とくぎ「渾身斬り」：MP3で強力な一撃。</div><div class="panel-stack">${btn('とじる','back')}</div>`;
      }else if(state.mode==='gameover'){
        html=`<div class="end-title">力尽きてしまった……</div><div>だが、ここで終わりではない。<br>体力と魔力を回復し、同じ敵にもう一度挑もう。</div><div class="panel-stack">${btn('この戦闘から再挑戦','retry')}${btn('タイトルにもどる','title')}</div>`;
      }else if(state.mode==='complete'){
        html=`<div class="end-title">第一章　完</div><div>石門の番兵は膝をついた。<br>バルド「合格だ、レオン。だが戦いは、ここから始まる。」<br><span class="gold">討伐隊への入隊が認められた！</span></div>`+
          `<div class="small-note">勝利数：${state.victories}　／　次章：まだ見ぬ仲間たち（構想中）</div>`+
          `<div class="panel-stack">${btn('タイトルにもどる','title')}${btn('最初から遊ぶ','new')}</div>`;
      }
      panel.innerHTML=html;
    }
    function dialogue(lines,onDone){
      state.mode='dialogue';state.dialogue={lines,i:0,onDone:onDone||null};updateUI();
    }
    function nextDialogue(){
      const d=state.dialogue;if(!d)return;
      d.i++;
      if(d.i>=d.lines.length){state.dialogue=null;state.mode='world';const f=d.onDone; if(f)f();else updateUI();save();}
      else updateUI();
    }
    function switchMap(name,x,y,lines){
      state.map=name;state.x=x;state.y=y;state.facing='up';state.mode='world';save();
      if(lines&&lines.length)dialogue(lines);else updateUI();
    }
    function activeNpcs(){return NPCS[state.map].filter(n=>!(n.id==='boss'&&state.flags.boss));}
    function npcAt(x,y){return activeNpcs().find(n=>n.x===x&&n.y===y);}
    function interact(){
      const [dx,dy]=DIRS[state.facing];
      let obj=npcAt(state.x+dx,state.y+dy);
      if(!obj){obj=activeNpcs().find(n=>Math.abs(n.x-state.x)+Math.abs(n.y-state.y)===1);}
      if(obj){talkTo(obj.id);return;}
      const closeChest=Math.abs(state.x-5)+Math.abs(state.y-19)===1;
      if(state.map==='dungeon'&&!state.flags.chest&&closeChest){
        state.flags.chest=true;state.hero.potions++;save();
        dialogue(['古い宝箱を開けた。','やくそうを 1 個 手に入れた！','道具は戦闘中の「どうぐ」から使える。']);return;
      }
      dialogue(['辺りを調べたが、特に変わったものはない。']);
    }
    function talkTo(id){
      if(id==='elder'){
        if(state.flags.elder){dialogue(['ミラ「街道には魔物がいる。慌てず、一手ずつ考えて戦いなさい。」']);return;}
        dialogue([
          'ミラ「レオン！ 生きていたのね……！」',
          'ミラ「王都アステルで、魔物討伐隊の志願者を募っているそうよ。」',
          'レオン「……村を襲った魔物を、このままにはしておけない。」',
          'ミラ「東の道へ行きなさい。ただし仇を討つより先に、生きて戻ることを覚えて。」'
        ],()=>{state.flags.elder=true;save();updateUI();});
      }else if(id==='captain'){
        if(state.flags.captain){dialogue(['バルド「北門から旧石門へ向かえ。試練は、最後まで生き残ることだ。」']);return;}
        dialogue([
          'バルド「討伐隊への志願者か。名は？」',
          'レオン「ミルト村のレオン。魔物に村を焼かれた。」',
          'バルド「復讐心だけでは剣を振るえん。守りたい者のために戦えるか？」',
          'レオン「……生き残った人たちを、もう失いたくない。」',
          'バルド「いい答えだ。北門の旧石門で試練を受けろ。支度は整えてやろう。」'
        ],()=>{state.flags.captain=true;state.hero.hp=state.hero.maxHp;state.hero.mp=state.hero.maxMp;save();updateUI();});
      }else if(id==='healer'){
        state.hero.hp=state.hero.maxHp;state.hero.mp=state.hero.maxMp;save();
        dialogue(['薬師「傷を見せて。……これで大丈夫。」','HPとMPが全回復した！','試練で困ったら、王都に戻っておいで。']);
      }else if(id==='boss'){
        dialogue([
          '石の甲冑が、軋む音を立てて動き出す。',
          '番兵「汝、なにを守るために剣を取る？」',
          'レオン「……俺と同じ思いをする人を、もう増やさないためだ！」',
          '番兵「ならば、己の命も守り抜いてみせよ！」'
        ],()=>startBattle('boss'));
      }
    }
    function move(dir){
      if(state.mode==='battle'){
        const b=state.battle;if(b.phase!=='command')return;
        const col=b.selected%2,row=Math.floor(b.selected/2);
        b.selected= dir==='left'?row*2:dir==='right'?row*2+1:dir==='up'?col:2+col;
        updateUI();return;
      }
      if(state.mode==='menu'){
        state.menuIndex=(state.menuIndex+(dir==='up'||dir==='left'?-1:1)+4)%4;updateUI();return;
      }
      if(state.mode!=='world')return;
      state.facing=dir;
      const [dx,dy]=DIRS[dir],nx=state.x+dx,ny=state.y+dy;
      if(nx<0||nx>=W||ny<0||ny>=H){
        if(state.map==='village'&&nx>=W&&ny>=11&&ny<=13){
          if(!state.flags.elder){dialogue(['レオン「……出発する前に、生き残った村人を探さないと。」']);return;}
          switchMap('road',1,12,['東の街道。灰色の空の下、王都へと続く道が伸びている。']);return;
        }
        if(state.map==='road'&&nx<0&&ny>=11&&ny<=13){switchMap('village',18,12);return;}
        if(state.map==='road'&&nx>=W&&ny>=11&&ny<=13){switchMap('capital',1,12,['城壁の先に、石造りの街が広がっていた。','討伐隊の受付を探そう。']);return;}
        if(state.map==='capital'&&nx<0&&ny>=11&&ny<=13){switchMap('road',18,12);return;}
        if(state.map==='capital'&&ny<0&&nx>=9&&nx<=11){
          if(!state.flags.captain){dialogue(['門番「討伐隊の志願者なら、先に広場の隊長バルドに会ってくれ。」']);return;}
          switchMap('dungeon',10,23,['旧石門。冷たい空気が流れ、奥から魔物の気配がする。','入隊試練の始まりだ。奥の番兵を倒そう。']);return;
        }
        if(state.map==='dungeon'&&ny>=H&&nx>=9&&nx<=11){switchMap('capital',10,1,['一度、王都へ戻ってきた。北門から試練を再開できる。']);return;}
        return;
      }
      if(npcAt(nx,ny)||!WALKABLE.has(MAPS[state.map][ny][nx])){updateUI();return;}
      state.x=nx;state.y=ny;
      if(state.map==='road'&&!state.flags.roadBattle&&state.x>=8){
        dialogue(['道をふさぐ小さな魔物が飛び出してきた！','レオン「剣を抜け……！ 初めての戦いだ。」'],()=>startBattle('slime'));
        return;
      }
      if(state.map==='dungeon'&&!state.flags.caveBattle&&state.y<=15){
        dialogue(['天井から黒い影が舞い降りた！','レオン「ここで覚えた技を試してみよう。」'],()=>startBattle('bat'));
        return;
      }
      save();updateUI();
    }
    function startBattle(id){
      const template=ENEMIES[id];
      state.mode='battle';
      state.checkpoint={map:state.map,x:state.x,y:state.y};
      state.battle={enemy:{...template,maxHp:template.hp},phase:'messages',messages:[],messageIndex:0,after:null,
        turn:0,selected:0,tutorialStep:id==='slime'?0:2};
      const note=id==='slime'?'チュートリアル：最初は「こうげき」！':id==='bat'?'「とくぎ」はMPを使う強い一撃。「どうぐ」でHPを回復できる。':'強烈な一撃の前には予兆がある。ぼうぎょも使おう。';
      battleMessages([`${template.name} が現れた！`,note],()=>{state.battle.phase='command';updateUI();});
    }
    function battleMessages(lines,after){
      const b=state.battle;b.phase='messages';b.messages=lines;b.messageIndex=0;b.after=after||null;updateUI();
    }
    function battleNext(){
      const b=state.battle;if(!b)return;
      b.messageIndex++;
      if(b.messageIndex>=b.messages.length){
        const after=b.after;b.after=null;
        if(after)after();else {b.phase='command';updateUI();}
      }else updateUI();
    }
    function chooseBattle(action){
      const b=state.battle;if(!b||b.phase!=='command')return;
      const num=['attack','defend','skill','item'].indexOf(action);
      if(num<0)return;
      if(b.enemy.id==='slime'&&b.tutorialStep<2&&num!==(b.tutorialStep===0?0:1)){
        battleMessages([b.tutorialStep===0?'まずは「こうげき」で、敵にダメージを与えよう。':'今は「ぼうぎょ」して、被害を抑えよう。'],()=>{b.phase='command';updateUI();});return;
      }
      if(action==='skill'&&state.hero.mp<3){battleMessages(['MPが足りない！'],()=>{b.phase='command';updateUI();});return;}
      if(action==='item'&&state.hero.potions<=0){battleMessages(['やくそうを持っていない！'],()=>{b.phase='command';updateUI();});return;}
      if(action==='item'&&state.hero.hp===state.hero.maxHp){battleMessages(['HPは満タンだ。今は使わなくてよさそうだ。'],()=>{b.phase='command';updateUI();});return;}
      const lines=[];let guarding=false;
      if(action==='attack'){
        const dmg=7+(b.turn*3)%4;b.enemy.hp=Math.max(0,b.enemy.hp-dmg);
        lines.push(`レオンの攻撃！ ${b.enemy.name}に ${dmg} ダメージ！`);
        if(b.enemy.id==='slime'&&b.tutorialStep===0)b.tutorialStep=1;
      }else if(action==='defend'){
        guarding=true;lines.push('レオンは盾を構え、身を守った！');
        if(b.enemy.id==='slime'&&b.tutorialStep===1)b.tutorialStep=2;
      }else if(action==='skill'){
        state.hero.mp-=3;const dmg=13+(b.turn%3)*2;b.enemy.hp=Math.max(0,b.enemy.hp-dmg);
        lines.push(`渾身斬り！ ${b.enemy.name}に ${dmg} ダメージ！`);
      }else if(action==='item'){
        state.hero.potions--;const healed=Math.min(20,state.hero.maxHp-state.hero.hp);state.hero.hp+=healed;
        lines.push(`やくそうを使った。HPが ${healed} 回復した！`);
      }
      if(b.enemy.hp<=0){
        lines.push(`${b.enemy.name}を倒した！`);
        battleMessages(lines,finishBattle);return;
      }
      let heavy=b.enemy.id==='boss'&&b.turn%3===2;
      if(b.enemy.id==='slime'&&b.tutorialStep===2&&guarding)heavy=true;
      const base=heavy?b.enemy.atk+7:b.enemy.atk+(b.turn%2);
      const dmg=guarding?Math.max(1,Math.ceil(base/4)):base;
      state.hero.hp=Math.max(0,state.hero.hp-dmg);
      lines.push(`${b.enemy.name}の${heavy?'強烈な':' '}攻撃！ ${dmg} ダメージ！${guarding?'（防御で軽減）':''}`);
      if(state.hero.hp<=0){lines.push('レオンは倒れた……。');battleMessages(lines,()=>{state.mode='gameover';updateUI();});return;}
      b.turn++;
      if(b.enemy.id==='slime'&&b.tutorialStep===1)lines.push('敵が大きく跳ねた！ 次の一撃は「ぼうぎょ」で受けよう。');
      if(b.enemy.id==='slime'&&b.tutorialStep===2&&guarding)lines.push('うまく防げた！ 「とくぎ」と「どうぐ」も使えるようになった。');
      if(b.enemy.id==='boss'&&b.turn%3===2)lines.push('番兵が武器を振り上げた！ 次のターンは要注意！');
      battleMessages(lines,()=>{b.phase='command';b.selected=0;save();updateUI();});
    }
    function finishBattle(){
      const enemy=state.battle.enemy.id;
      state.battle=null;state.checkpoint=null;state.mode='world';state.victories++;
      if(enemy==='slime'){
        state.flags.roadBattle=true;state.hero.potions++;state.hero.hp=Math.min(state.hero.maxHp,state.hero.hp+5);
        state.hero.mp=Math.min(state.hero.maxMp,state.hero.mp+3);save();
        dialogue(['初めての勝利だ！ やくそうを 1 個手に入れた。','戦闘では「こうげき」「ぼうぎょ」「とくぎ」「どうぐ」を使い分けよう。','レオン「……俺にも戦える。王都を目指そう。」']);
      }else if(enemy==='bat'){
        state.flags.caveBattle=true;state.hero.level=2;state.hero.maxHp=52;state.hero.maxMp=14;
        state.hero.hp=state.hero.maxHp;state.hero.mp=state.hero.maxMp;state.hero.potions++;save();
        dialogue(['コウモリを倒した！ 戦いの中で、少し強くなった。','レベル 2 に上がった！ HP・MPが全回復した。','やくそうを 1 個手に入れた。最奥の番兵に挑もう。']);
      }else if(enemy==='boss'){
        state.flags.boss=true;state.mode='complete';save();updateUI();
      }
    }
    function retryBattle(){
      if(!state.battle)return;
      state.hero.hp=state.hero.maxHp;state.hero.mp=state.hero.maxMp;
      state.hero.potions=Math.max(state.hero.potions,2);
      const id=state.battle.enemy.id;startBattle(id);
    }
    function title(){state.mode='title';state.dialogue=null;state.battle=null;updateUI();}
    function openMenu(){state.mode='menu';state.menuIndex=0;updateUI();}
    function menuAct(action){
      if(action==='resume'||action==='back'){state.mode='world';updateUI();}
      else if(action==='save'){save();state.mode='world';dialogue(['冒険の記録を保存した！']);}
      else if(action==='restart'){startNew();}
      else if(action==='help'){state.mode='help';updateUI();}
    }
    function button(key){
      if(state.mode==='title'){
        if(key==='A')startNew();else if(key==='Y'||key==='X'){state.mode='help';state.returnTo='title';updateUI();}return;
      }
      if(state.mode==='dialogue'){if(key==='A'||key==='B')nextDialogue();return;}
      if(state.mode==='battle'){
        if(key==='A'){const b=state.battle;if(b.phase==='messages')battleNext();else chooseBattle(['attack','defend','skill','item'][b.selected]);}
        else if(key==='X'||key==='Y'){const b=state.battle;if(b.phase==='command')battleMessages(['こうげき：MP不要の基本攻撃。','ぼうぎょ：そのターンに受けるダメージを大幅に減らす。','とくぎ：MP3で大ダメージ。どうぐ：やくそうでHPを回復。'],()=>{b.phase='command';updateUI();});}
        else if(key==='B'&&state.battle.phase==='messages')battleNext();
        return;
      }
      if(state.mode==='world'){
        if(key==='A')interact();
        else if(key==='X')openMenu();
        else if(key==='Y'){state.mode='status';updateUI();}
        return;
      }
      if(state.mode==='menu'){
        if(key==='B')menuAct('resume');
        if(key==='A')menuAct(['resume','save','restart','help'][state.menuIndex]);return;
      }
      if(state.mode==='help'){
        if(key==='A'||key==='B'||key==='X'||key==='Y'){state.mode=state.returnTo==='title'?'title':'world';state.returnTo=null;updateUI();}return;
      }
      if(state.mode==='status'){
        if(key==='A'||key==='B'||key==='Y'){state.mode='world';updateUI();}return;
      }
      if(state.mode==='gameover'){
        if(key==='A')retryBattle();else if(key==='B')title();return;
      }
      if(state.mode==='complete'){
        if(key==='A')title();return;
      }
    }
    function actionClick(action){
      if(['attack','defend','skill','item'].includes(action)){chooseBattle(action);return;}
      if(action==='new'){startNew();return;}
      if(action==='continue'){if(!restore())startNew();return;}
      if(action==='titlehelp'){state.mode='help';state.returnTo='title';updateUI();return;}
      if(action==='title'){title();return;}
      if(action==='retry'){retryBattle();return;}
      if(action==='back'){
        state.mode=state.returnTo==='title'?'title':'world';state.returnTo=null;updateUI();return;
      }
      if(['resume','save','restart','help'].includes(action)){menuAct(action);return;}
    }
    panel.addEventListener('click',e=>{
      const b=e.target.closest('[data-action]');
      if(b){actionClick(b.dataset.action);return;}
      if(state.mode==='dialogue')nextDialogue();
      else if(state.mode==='battle'&&state.battle.phase==='messages')battleNext();
    });

    // タッチ長押しで連続移動。指が離れたら必ず停止する。
    let held=null,delayTimer=null,repeatTimer=null;
    function release(){if(held)held.classList.remove('pressed');held=null;clearTimeout(delayTimer);clearInterval(repeatTimer);}
    document.querySelectorAll('[data-dir]').forEach(el=>{
      el.addEventListener('pointerdown',e=>{
        e.preventDefault();release();held=el;el.classList.add('pressed');
        try{el.setPointerCapture(e.pointerId);}catch(_){}
        move(el.dataset.dir);
        delayTimer=setTimeout(()=>{repeatTimer=setInterval(()=>move(el.dataset.dir),145);},260);
      });
      el.addEventListener('pointerup',release);
      el.addEventListener('pointercancel',release);
      el.addEventListener('lostpointercapture',release);
    });
    document.querySelectorAll('[data-key]').forEach(el=>{

        e.preventDefault();el.classList.add('pressed');button(el.dataset.key);

      });

    });
    const KEYMAP={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
    let lastKeyTime=0;
    document.addEventListener('keydown',e=>{
      if(e.target instanceof HTMLInputElement||e.target instanceof HTMLTextAreaElement)return;
      const k=KEYMAP[e.key]||KEYMAP[e.key.toLowerCase()];
      if(k){e.preventDefault();const now=performance.now();if(now-lastKeyTime>85){move(k);lastKeyTime=now;}return;}
      const z=e.key.toLowerCase();
      const key=e.key==='Enter'||e.key===' '||z==='z'?'A':e.key==='Escape'||z==='c'?'B':z==='x'||z==='m'?'X':z==='y'||z==='h'?'Y':null;

    const HERO=[
      '......HH......','.....HHHH.....','.....SSSS.....','....KSSSSK....',
      '.....KKKK.....','.....RRRR.....','....RRRRRR....','...ARRRRRRA...',
      '...A.RRRR.A...','.....CCCC.....','.....CCCC.....','.....CNN C....'.replace(' ',''),
      '.....N..N.....','....NN..NN....','....KK..KK....','...KKK..KKK...'
    ];
    const ELDER=[
      '.....HHHH.....','....HHHHHH....','.....SSSS.....','....KSSSSK....',
      '.....KKKK.....','.....GGGG.....','....GGGGGG....','....GGGGGG....',
      '....AGGGGA....','.....GGGG.....','.....GGGG.....','.....GGGG.....',
      '.....N..N.....','....NN..NN....','....KK..KK....','...KKK..KKK...'
    ];
    const CAPTAIN=[
      '.....CCCC.....','....CCCCCC....','.....SSSS.....','....KSSSSK....',
      '.....KKKK.....','.....NNNN.....','....NNNNNN....','...ANNNNNNA...',
      '...A.NNNN.A...','.....RRRR.....','.....RRRR.....','.....RRRR.....',
      '.....N..N.....','....NN..NN....','....KK..KK....','...KKK..KKK...'
    ];
    function actor(npc,x,y){
      const map=npc==='hero'?HERO:npc==='elder'?ELDER:npc==='captain'?CAPTAIN:ELDER;
      const pal={H:npc==='elder'?'#bebfc1':'#533a2c',S:'#deb993',K:'#17222d',R:'#9c4448',A:'#d5b58e',
        C:npc==='hero'?'#8eafb1':'#c2c6c9',N:npc==='captain'?'#3a6075':'#536777',G:'#8f7554'};
      // 16×16ピクセルパターンをタイルに合わせて描く。
      spritePattern(map,pal,x,y,1);
      if(npc==='hero'){
        if(state.facing==='left')rect(x-2,y+6,2,8,'#cbd5d3');
        if(state.facing==='right')rect(x+16,y+6,2,8,'#cbd5d3');
      }
    }
    function drawWorld(time){
      const m=MAPS[state.map];
      for(let y=0;y<H;y++)for(let x=0;x<W;x++){
        let c=m[y][x];if(state.map==='dungeon'&&state.flags.chest&&x===5&&y===19)c='f';
        tile(c,x,y,state.map,time);
      }
      if(state.map==='village'){
        rect(0,0,320,400,'#34303411');
        rect(9*T,9*T+10,36,2,'#695a51');
      }
      if(state.map==='dungeon'){
        for(let k=0;k<8;k++){const x=(k*37+23)%310,y=(k*43+31)%380;rect(x,y,2,2,'#a0936133');}
      }
      for(const n of activeNpcs()){
        const id=n.id==='elder'?'elder':n.id==='captain'||n.id==='boss'?'captain':'elder';
        if(n.id==='boss')drawGuardian(n.x*T-11,n.y*T-23,1);
        else actor(id,n.x*T,n.y*T-1);
        const waiting=(n.id==='elder'&&!state.flags.elder)||(n.id==='captain'&&!state.flags.captain);
        if(waiting){rect(n.x*T+5,n.y*T-11,7,9,'#253241');ctx.fillStyle='#ffe299';ctx.font='bold 9px monospace';ctx.fillText('!',n.x*T+6,n.y*T-4);}
      }
      actor('hero',state.x*T,state.y*T-1);
      const near=activeNpcs().find(n=>Math.abs(state.x-n.x)+Math.abs(state.y-n.y)===1);
      if(near&&state.mode==='world'){
        const text=near.name;ctx.font='bold 10px sans-serif';const tw=ctx.measureText(text).width;
        const xx=Math.max(3,Math.min(320-tw-11,near.x*T+8-tw/2));
        rect(xx-3,near.y*T-26,tw+6,14,'#172336e6');
        ctx.fillStyle='#ffe5a8';ctx.fillText(text,xx,near.y*T-15);
      }
    }
    const SLIME=[
      '................','......OOOO......','....OOOOOOOO....','...OOOOOOOOOO...',
      '..OOOOOOOOOOOO..','..OOOWOOOOWOO..','..OOOKOOOOKOOO..','..OOOOOOOOOOOO..',
      '.OOOOOOOOOOOOOO.','.OOOOOOOOKOOOOO.','.OOOOOOOOOOOOOO.','..OOOOOOOOOOOO..',
      '..OOOOOOOOOOOO..','...OOOOOOOOOO...','....OOOOOOOO....','......OOOO......'
    ];
    const BAT=[
      '................','O....O....O....O','OO..OO....OO..OO','OOOOOO....OOOOOO',
      'OOOOOOOOOOOOOOOO','.OOOOOOOOOOOOOO.','..OOOOOOOOOOOO..','...OOOOOOOOOO...',
      '....OOOWWOOO....','.....OOKKOO.....','.....OOOOOO.....','......OOOO......',
      '......OOOO......','.......OO.......','................','................'
    ];
    const GUARDIAN=[
      '.....CCCCCC.....','....CCCCCCCC....','...CCKKKKKKCC...','...CKSSSSSSKC...',
      '...CKSKKSSKC....','...CCKKKKKKCC...','....CCCCCCCC....','...CCCCCCCCCC...',
      '..CCCCCCCCCCCC..','..CCCCCCCCCCCC..','..CCCCCCCCCCCC..','...CCCCCCCCCC...',
      '...CCCCCCCCCC...','....CCC..CCC....','...CCCC..CCCC...','..CCCCC..CCCCC..'
    ];
    function drawGuardian(x,y,scale){spritePattern(GUARDIAN,{C:'#8797a3',K:'#283747',S:'#ccad71'},x,y,scale);}
    function drawBattle(time){
      rect(0,0,320,400,'#172331');
      for(let i=0;i<17;i++){
        const xx=(i*43+12)%320,yy=(i*27+80)%190;
        rect(xx,yy,2,2,'#334a5b');
      }
      ctx.fillStyle='#263b47';ctx.beginPath();ctx.moveTo(0,175);ctx.lineTo(75,123);ctx.lineTo(145,160);ctx.lineTo(238,101);ctx.lineTo(320,150);ctx.lineTo(320,270);ctx.lineTo(0,270);ctx.fill();
      rect(0,250,320,150,'#3c4546');rect(0,254,320,3,'#52605a');
      for(let i=0;i<18;i++)rect((i*37)%320,267+(i*11)%94,13,2,'#52615a');
      const b=state.battle;
      if(!b)return;
      const scale=b.enemy.id==='boss'?6:b.enemy.id==='bat'?7:7;
      const sz=16*scale,x=Math.floor((320-sz)/2),y=b.enemy.id==='boss'?111:129+Math.round(Math.sin(time/290)*3);
      rect(45,260,230,12,'#1e2f34');rect(75,270,170,3,'#2e3c3f');
      if(b.enemy.id==='slime')spritePattern(SLIME,{O:'#78b1a4',W:'#cce5d0',K:'#263c43'},x,y,scale);
      else if(b.enemy.id==='bat')spritePattern(BAT,{O:'#655a83',W:'#dc9b6b',K:'#1e2431'},x,y,scale);
      else drawGuardian(x,y,scale);
      if(b.enemy.id==='boss'&&b.turn%3===2){
        ctx.fillStyle='#ffb566';ctx.font='bold 19px sans-serif';ctx.textAlign='center';
        ctx.fillText('！',160,90);ctx.textAlign='left';
      }
    }
    function drawTitle(time,ended){
      rect(0,0,320,400,'#182535');
      for(let i=0;i<35;i++){const x=(i*71+23)%320,y=(i*49+11)%210;rect(x,y,2,2,i%3?'#425060':'#b3a58c');}
      ctx.fillStyle='#2c4050';ctx.beginPath();ctx.moveTo(0,225);ctx.lineTo(63,153);ctx.lineTo(129,198);ctx.lineTo(216,127);ctx.lineTo(320,205);ctx.lineTo(320,300);ctx.lineTo(0,300);ctx.fill();
      rect(0,284,320,116,'#283a3c');
      for(let i=0;i<10;i++){
        const x=i*37-13,y=273+(i*7)%35;
        rect(x,y,23,55,'#1d2b32');rect(x+4,y-8,17,12,'#1d2b32');
      }
      spritePattern(HERO,{H:'#4b342f',S:'#e2b691',K:'#19252a',R:'#a43c45',A:'#eed492',C:'#becacc',N:'#54677b'},124,208+Math.round(Math.sin(time/550)*2),4);
      ctx.textAlign='center';ctx.fillStyle='#1c2732';ctx.font='bold 29px serif';ctx.fillText('灰燼の誓い',162,108);
      ctx.fillStyle='#f6dfae';ctx.fillText('灰燼の誓い',160,105);
      ctx.font='bold 13px sans-serif';ctx.fillStyle='#e0bf7b';
      ctx.fillText(ended?'試練を越えて、旅は続く':'第一章　戦士と石門',160,130);
      ctx.textAlign='left';
    }
    function fitFrame(){
      const aw=Math.max(100,area.clientWidth-10),ah=Math.max(120,area.clientHeight-10);
      const width=Math.floor(Math.min(aw,ah*0.8));
      frame.style.width=width+'px';frame.style.height=Math.floor(width*1.25)+'px';
    }
    if(window.ResizeObserver){const obs=new ResizeObserver(fitFrame);obs.observe(area);}else window.addEventListener('resize',fitFrame);
    fitFrame();
    let lastPaint=0;
    function paint(time){
      requestAnimationFrame(paint);
      if(time-lastPaint<80)return;
      lastPaint=time;ctx.imageSmoothingEnabled=false;
      if(state.mode==='title'||state.mode==='complete')drawTitle(time,state.mode==='complete');
      else if(state.mode==='battle'||state.mode==='gameover')drawBattle(time);
      else drawWorld(time);
    }
    requestAnimationFrame(paint);
    updateUI();
  })();
  </script>
</body>
</html>
